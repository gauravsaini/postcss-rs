[package]
name = "postcss_rs"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.8", features = ["napi4"] }
napi-derive = "2.16.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mimalloc = "0.1"

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
